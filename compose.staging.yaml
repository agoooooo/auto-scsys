services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FLOWPILOT_POSTGRES_DB:?Set FLOWPILOT_POSTGRES_DB}
      POSTGRES_USER: ${FLOWPILOT_POSTGRES_USER:?Set FLOWPILOT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${FLOWPILOT_POSTGRES_PASSWORD:?Set FLOWPILOT_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [staging]

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --address ":9000" --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${FLOWPILOT_S3_ACCESS_KEY:?Set FLOWPILOT_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${FLOWPILOT_S3_SECRET_KEY:?Set FLOWPILOT_S3_SECRET_KEY}
    volumes:
      - object_data:/data
    ports:
      - "${FLOWPILOT_STAGING_BIND_ADDRESS:-127.0.0.1}:${FLOWPILOT_STAGING_S3_PORT:-19000}:9000"
    networks: [staging]

  storage-init:
    build: .
    command: ["python", "-m", "server.init_storage"]
    restart: "no"
    environment: &staging_api_environment
      FLOWPILOT_ENV: staging
      FLOWPILOT_DATABASE_URL: ${FLOWPILOT_DATABASE_URL:?Set a PostgreSQL FLOWPILOT_DATABASE_URL}
      FLOWPILOT_TOKEN_SECRET: ${FLOWPILOT_TOKEN_SECRET:?Set a random FLOWPILOT_TOKEN_SECRET of at least 32 characters}
      FLOWPILOT_CORS_ORIGINS: ${FLOWPILOT_STAGING_WEB_ORIGIN:?Set the exact private staging Web origin}
      FLOWPILOT_S3_ENDPOINT_URL: http://minio:9000
      FLOWPILOT_S3_PUBLIC_ENDPOINT_URL: ${FLOWPILOT_STAGING_S3_PUBLIC_ENDPOINT:?Set the reachable private staging S3 endpoint}
      FLOWPILOT_S3_REGION: ${FLOWPILOT_S3_REGION:-us-east-1}
      FLOWPILOT_S3_BUCKET: ${FLOWPILOT_S3_BUCKET:-flowpilot-staging}
      FLOWPILOT_S3_ACCESS_KEY: ${FLOWPILOT_S3_ACCESS_KEY:?Set FLOWPILOT_S3_ACCESS_KEY}
      FLOWPILOT_S3_SECRET_KEY: ${FLOWPILOT_S3_SECRET_KEY:?Set FLOWPILOT_S3_SECRET_KEY}
      FLOWPILOT_S3_CORS_ORIGINS: ${FLOWPILOT_STAGING_WEB_ORIGIN:?Set the exact private staging Web origin}
    depends_on:
      minio:
        condition: service_started
    networks: [staging]

  api:
    build: .
    restart: unless-stopped
    environment: *staging_api_environment
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    ports:
      - "${FLOWPILOT_STAGING_BIND_ADDRESS:-127.0.0.1}:${FLOWPILOT_STAGING_API_PORT:-18001}:8001"
    networks: [staging]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./demo:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FLOWPILOT_STAGING_BIND_ADDRESS:-127.0.0.1}:${FLOWPILOT_STAGING_WEB_PORT:-18000}:80"
    networks: [staging]

volumes:
  postgres_data:
  object_data:

networks:
  staging:
