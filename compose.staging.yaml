services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FLOWPILOT_POSTGRES_DB:?Set FLOWPILOT_POSTGRES_DB}
      POSTGRES_USER: ${FLOWPILOT_POSTGRES_USER:?Set FLOWPILOT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${FLOWPILOT_POSTGRES_PASSWORD:?Set FLOWPILOT_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [staging]

  object-store-volume-init:
    image: alpine:3.21
    command:
      - sh
      - -ec
      - chown -R 10001:10001 /data/rustfs0 /data/rustfs1 /data/rustfs2 /data/rustfs3
    volumes:
      - object_data_0:/data/rustfs0
      - object_data_1:/data/rustfs1
      - object_data_2:/data/rustfs2
      - object_data_3:/data/rustfs3
    restart: "no"
    networks: [staging]

  object-store:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0...3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      # Local single-host staging only; never enable this for production storage.
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
      RUSTFS_ACCESS_KEY: ${FLOWPILOT_S3_ACCESS_KEY:?Set FLOWPILOT_S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${FLOWPILOT_S3_SECRET_KEY:?Set FLOWPILOT_S3_SECRET_KEY}
    volumes:
      - object_data_0:/data/rustfs0
      - object_data_1:/data/rustfs1
      - object_data_2:/data/rustfs2
      - object_data_3:/data/rustfs3
    ports:
      - "${FLOWPILOT_STAGING_BIND_ADDRESS:-127.0.0.1}:${FLOWPILOT_STAGING_S3_PORT:-19000}:9000"
    depends_on:
      object-store-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [staging]

  storage-init:
    build: .
    command: ["python", "-m", "server.init_storage"]
    restart: "no"
    environment: &staging_api_environment
      FLOWPILOT_ENV: staging
      FLOWPILOT_DATABASE_URL: ${FLOWPILOT_DATABASE_URL:?Set a PostgreSQL FLOWPILOT_DATABASE_URL}
      FLOWPILOT_TOKEN_SECRET: ${FLOWPILOT_TOKEN_SECRET:?Set a random FLOWPILOT_TOKEN_SECRET of at least 32 characters}
      FLOWPILOT_CORS_ORIGINS: ${FLOWPILOT_STAGING_WEB_ORIGIN:?Set the exact private staging Web origin}
      FLOWPILOT_S3_ENDPOINT_URL: http://object-store:9000
      FLOWPILOT_S3_PUBLIC_ENDPOINT_URL: ${FLOWPILOT_STAGING_S3_PUBLIC_ENDPOINT:?Set the reachable private staging S3 endpoint}
      FLOWPILOT_S3_REGION: ${FLOWPILOT_S3_REGION:-us-east-1}
      FLOWPILOT_S3_BUCKET: ${FLOWPILOT_S3_BUCKET:-flowpilot-staging}
      FLOWPILOT_S3_ACCESS_KEY: ${FLOWPILOT_S3_ACCESS_KEY:?Set FLOWPILOT_S3_ACCESS_KEY}
      FLOWPILOT_S3_SECRET_KEY: ${FLOWPILOT_S3_SECRET_KEY:?Set FLOWPILOT_S3_SECRET_KEY}
      FLOWPILOT_S3_CORS_ORIGINS: ${FLOWPILOT_STAGING_WEB_ORIGIN:?Set the exact private staging Web origin}
    depends_on:
      object-store:
        condition: service_healthy
    networks: [staging]

  api:
    build: .
    restart: unless-stopped
    environment:
      <<: *staging_api_environment
      FLOWPILOT_SMTP_HOST: ${FLOWPILOT_SMTP_HOST:-}
      FLOWPILOT_SMTP_PORT: ${FLOWPILOT_SMTP_PORT:-587}
      FLOWPILOT_SMTP_USERNAME: ${FLOWPILOT_SMTP_USERNAME:-}
      FLOWPILOT_SMTP_PASSWORD: ${FLOWPILOT_SMTP_PASSWORD:-}
      FLOWPILOT_SMTP_FROM: ${FLOWPILOT_SMTP_FROM:-}
      FLOWPILOT_SMTP_USE_SSL: ${FLOWPILOT_SMTP_USE_SSL:-false}
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    ports:
      - "${FLOWPILOT_STAGING_BIND_ADDRESS:-127.0.0.1}:${FLOWPILOT_STAGING_API_PORT:-18001}:8001"
    networks: [staging]

  web:
    build:
      context: .
      dockerfile: console/Dockerfile
    restart: unless-stopped
    ports:
      - "${FLOWPILOT_STAGING_BIND_ADDRESS:-127.0.0.1}:${FLOWPILOT_STAGING_WEB_PORT:-18000}:80"
    networks: [staging]

volumes:
  postgres_data:
  object_data_0:
  object_data_1:
  object_data_2:
  object_data_3:

networks:
  staging:
