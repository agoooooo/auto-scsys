services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FLOWPILOT_POSTGRES_DB:?Set FLOWPILOT_POSTGRES_DB}
      POSTGRES_USER: ${FLOWPILOT_POSTGRES_USER:?Set FLOWPILOT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${FLOWPILOT_POSTGRES_PASSWORD:?Set FLOWPILOT_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --address ":9000" --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${FLOWPILOT_S3_ACCESS_KEY:?Set FLOWPILOT_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${FLOWPILOT_S3_SECRET_KEY:?Set FLOWPILOT_S3_SECRET_KEY}
    volumes:
      - object_data:/data
    networks: [internal]

  storage-init:
    build: .
    command: ["python", "-m", "server.init_storage"]
    restart: "no"
    environment: &api_environment
      FLOWPILOT_ENV: production
      FLOWPILOT_DATABASE_URL: ${FLOWPILOT_DATABASE_URL:?Set an encoded PostgreSQL FLOWPILOT_DATABASE_URL}
      FLOWPILOT_TOKEN_SECRET: ${FLOWPILOT_TOKEN_SECRET:?Set a random FLOWPILOT_TOKEN_SECRET of at least 32 characters}
      FLOWPILOT_CORS_ORIGINS: https://${FLOWPILOT_WEB_DOMAIN:?Set FLOWPILOT_WEB_DOMAIN}
      FLOWPILOT_S3_ENDPOINT_URL: http://minio:9000
      FLOWPILOT_S3_REGION: ${FLOWPILOT_S3_REGION:-us-east-1}
      FLOWPILOT_S3_BUCKET: ${FLOWPILOT_S3_BUCKET:-flowpilot-scripts}
      FLOWPILOT_S3_ACCESS_KEY: ${FLOWPILOT_S3_ACCESS_KEY:?Set FLOWPILOT_S3_ACCESS_KEY}
      FLOWPILOT_S3_SECRET_KEY: ${FLOWPILOT_S3_SECRET_KEY:?Set FLOWPILOT_S3_SECRET_KEY}
    depends_on:
      minio:
        condition: service_started
    networks: [internal]

  api:
    build: .
    restart: unless-stopped
    environment: *api_environment
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    networks: [internal]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./demo:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal]

  proxy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      FLOWPILOT_API_DOMAIN: ${FLOWPILOT_API_DOMAIN:?Set FLOWPILOT_API_DOMAIN}
      FLOWPILOT_WEB_DOMAIN: ${FLOWPILOT_WEB_DOMAIN:?Set FLOWPILOT_WEB_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    networks: [internal]

volumes:
  postgres_data:
  object_data:
  caddy_data:
  caddy_config:

networks:
  internal:
